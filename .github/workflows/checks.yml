name: Checks

# Each pull request and each push to main-v1 runs the format check and the
# test harness. This workflow deploys nothing.

on:
  pull_request:
  push:
    branches: [main-v1]

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Each action is pinned to a commit SHA. A tag can move to other code
      # after a repository compromise. A SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install the format tool
        run: npm ci --ignore-scripts

      - name: Check the format
        run: npm run format:check

      # With the key, the harness sends one real request to the concentration
      # route. The key belongs to CI alone, and the harness prints no part of
      # it. A pull request from a fork gets no secret, so the harness then
      # runs with --offline and skips the real request.
      - name: Test the script
        env:
          HOLDINGS_API_KEY: ${{ secrets.HOLDINGS_API_KEY }}
        run: |
          if [ -n "$HOLDINGS_API_KEY" ]; then
            node test/check.mjs
          else
            node test/check.mjs --offline
          fi
