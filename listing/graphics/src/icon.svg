<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Holdings Concentration">
  <!-- The icon at 96 px and 128 px. Each coordinate is a multiple of 4, so
       each edge falls on a whole pixel at both sizes. The ranked bars stand
       for the report: the largest holding first. Colors: ink #1A1A18 for the
       square and gold #C9A227 for the bars. -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#1A1A18"/>
  <rect x="28" y="28" width="72" height="12" rx="2" fill="#C9A227"/>
  <rect x="28" y="48" width="48" height="12" rx="2" fill="#C9A227"/>
  <rect x="28" y="68" width="32" height="12" rx="2" fill="#C9A227"/>
  <rect x="28" y="88" width="20" height="12" rx="2" fill="#C9A227"/>
</svg>
